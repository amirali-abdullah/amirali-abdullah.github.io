<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#f8f9fa"/>
  <defs>
    <marker id="loop-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#0076df"/>
    </marker>
  </defs>
  <!-- Outer feedback loop -->
  <path d="M100,40 A60,60 0 0,1 160,100" fill="none" stroke="#0076df" stroke-width="2.5" opacity="0.7" marker-end="url(#loop-arrow)"/>
  <path d="M160,100 A60,60 0 0,1 100,160" fill="none" stroke="#0076df" stroke-width="2.5" opacity="0.6"/>
  <path d="M100,160 A60,60 0 0,1 40,100" fill="none" stroke="#0076df" stroke-width="2.5" opacity="0.5"/>
  <path d="M40,100 A60,60 0 0,1 100,40" fill="none" stroke="#0076df" stroke-width="2.5" opacity="0.4"/>
  <!-- Inner feedback loop -->
  <path d="M100,65 A35,35 0 0,1 135,100" fill="none" stroke="#6f42c1" stroke-width="2" opacity="0.6"/>
  <path d="M135,100 A35,35 0 0,1 100,135" fill="none" stroke="#6f42c1" stroke-width="2" opacity="0.5"/>
  <path d="M100,135 A35,35 0 0,1 65,100" fill="none" stroke="#6f42c1" stroke-width="2" opacity="0.4"/>
  <path d="M65,100 A35,35 0 0,1 100,65" fill="none" stroke="#6f42c1" stroke-width="2" opacity="0.3"/>
  <!-- Node points on the loops -->
  <circle cx="100" cy="40" r="4" fill="#0076df" opacity="0.8"/>
  <circle cx="160" cy="100" r="4" fill="#0076df" opacity="0.7"/>
  <circle cx="100" cy="160" r="4" fill="#0076df" opacity="0.6"/>
  <circle cx="40" cy="100" r="4" fill="#0076df" opacity="0.5"/>
  <!-- Center -->
  <circle cx="100" cy="100" r="5" fill="#6f42c1" opacity="0.6"/>
  <!-- Small connecting spokes -->
  <line x1="100" y1="65" x2="100" y2="95" stroke="#adb5bd" stroke-width="1" opacity="0.3"/>
  <line x1="135" y1="100" x2="105" y2="100" stroke="#adb5bd" stroke-width="1" opacity="0.3"/>
</svg>