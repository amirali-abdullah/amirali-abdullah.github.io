<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#f8f9fa"/>
  <defs>
    <marker id="dir-arrow" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5" fill="#0076df" opacity="0.6"/>
    </marker>
  </defs>
  <!-- Polygon with highlighted boundary -->
  <polygon points="100,35 155,65 170,120 135,165 65,165 30,120 45,65"
    fill="#0076df" opacity="0.08"
    stroke="#0076df" stroke-width="3" stroke-linejoin="round" opacity="0.7"/>
  <!-- Inner region fill -->
  <polygon points="100,55 140,78 150,118 125,148 75,148 50,118 60,78"
    fill="#6f42c1" opacity="0.06"/>
  <!-- Directed edges along boundary -->
  <line x1="100" y1="35" x2="155" y2="65" stroke="#0076df" stroke-width="2" marker-end="url(#dir-arrow)" opacity="0.6"/>
  <line x1="155" y1="65" x2="170" y2="120" stroke="#0076df" stroke-width="2" marker-end="url(#dir-arrow)" opacity="0.6"/>
  <line x1="170" y1="120" x2="135" y2="165" stroke="#0076df" stroke-width="2" marker-end="url(#dir-arrow)" opacity="0.6"/>
  <line x1="135" y1="165" x2="65" y2="165" stroke="#0076df" stroke-width="2" marker-end="url(#dir-arrow)" opacity="0.6"/>
  <line x1="65" y1="165" x2="30" y2="120" stroke="#0076df" stroke-width="2" marker-end="url(#dir-arrow)" opacity="0.6"/>
  <line x1="30" y1="120" x2="45" y2="65" stroke="#0076df" stroke-width="2" marker-end="url(#dir-arrow)" opacity="0.6"/>
  <line x1="45" y1="65" x2="100" y2="35" stroke="#0076df" stroke-width="2" marker-end="url(#dir-arrow)" opacity="0.6"/>
  <!-- Vertex dots -->
  <circle cx="100" cy="35" r="3" fill="#0076df" opacity="0.8"/>
  <circle cx="155" cy="65" r="3" fill="#0076df" opacity="0.8"/>
  <circle cx="170" cy="120" r="3" fill="#0076df" opacity="0.8"/>
  <circle cx="135" cy="165" r="3" fill="#0076df" opacity="0.8"/>
  <circle cx="65" cy="165" r="3" fill="#0076df" opacity="0.8"/>
  <circle cx="30" cy="120" r="3" fill="#0076df" opacity="0.8"/>
  <circle cx="45" cy="65" r="3" fill="#0076df" opacity="0.8"/>
</svg>