<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#f8f9fa"/>
  <!-- Baseline axis -->
  <line x1="30" y1="155" x2="170" y2="155" stroke="#adb5bd" stroke-width="1" opacity="0.5"/>
  <!-- Histogram bars with varying heights - feature distribution -->
  <rect x="38" y="140" width="10" height="15" rx="1" fill="#0076df" opacity="0.3"/>
  <rect x="52" y="125" width="10" height="30" rx="1" fill="#0076df" opacity="0.4"/>
  <rect x="66" y="105" width="10" height="50" rx="1" fill="#0076df" opacity="0.5"/>
  <rect x="80" y="80" width="10" height="75" rx="1" fill="#0076df" opacity="0.65"/>
  <rect x="94" y="65" width="10" height="90" rx="1" fill="#0076df" opacity="0.8"/>
  <rect x="108" y="75" width="10" height="80" rx="1" fill="#0076df" opacity="0.7"/>
  <rect x="122" y="95" width="10" height="60" rx="1" fill="#0076df" opacity="0.55"/>
  <rect x="136" y="120" width="10" height="35" rx="1" fill="#0076df" opacity="0.4"/>
  <rect x="150" y="138" width="10" height="17" rx="1" fill="#0076df" opacity="0.3"/>
  <!-- Bell curve overlay -->
  <path d="M35,152 Q50,140 65,115 Q80,85 99,62 Q118,85 135,115 Q150,140 165,152" fill="none" stroke="#6f42c1" stroke-width="2" opacity="0.5"/>
  <!-- Selection highlight on peak features -->
  <rect x="80" y="58" width="38" height="100" rx="3" fill="none" stroke="#20c997" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
</svg>